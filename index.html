<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音楽アメーバ</title>
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="lib/matter.min.js"></script>
    <script src="skecth_20260822.js"></script>
    <style>
        body{
            margin: 0;
            overflow: hidden;
            background: #111;
        }
        canvas{
            display: block;
            position: fixed;
            z-index: 0;
        }

        #musicUI{

            position: absolute;

            left:50%;
            top:50%;

            transform: translate(-50%,-50%);

            z-index: 99999;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 15px;

        }

        #musicUI label{

            color: white;

            font-size: 24px;

            font-family: sans-serif;

            letter-spacing: 3px;

            text-shadow: 0 0 15 rgba(255,255,255,.8);
        }

        #musicSelect{

            width:min(70vw,380px);

            height:55px;

            font-size:clamp(16px,2vw,22px);

            border:2px solid rgba(255,255,255,.5);

            background:rgba(255,255,255,.15);

            color:white;

            backdrop-filter:blur(10px);

            padding:0 20px;

            outline:none;

            text-align:center;

            transition:.3s;

        }

        #musicSelect option{
            background: #111;
            color: #fff;
            text-align: center;
        }

        #musicSelect:hover{

            background:rgba(255,255,255,.25);

            transform:scale(1.03);
        }

        #musicSelect:focus{

            border-color: #7efcff;

            box-shadow: 0 0 20px rgba(120,250,255,.6);
        }

        @media (max-width:768px){
            #mudicSeiect{

                width:220px;

                height:50px;

                font-size:16px;
            }
            #musicUI label{

                font-size: 20px;
            }
        }
    </style>
</head>
<body>

  <div id="musicUI">
    <label for="musicSelect">MUSIC</label>
    <select id="musicSelect">
        <option value="">音楽を選択</option>
        <option value="bgm/126_BPM142.mp3">音楽1</option>
        <option value="bgm/413_BPM168.mp3">音楽2</option>
    </select>
  </div>
</body>
</html>
